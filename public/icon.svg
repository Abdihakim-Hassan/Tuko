<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Royal Emerald Gradient (Full Bleed Background) -->
    <radialGradient id="tukoRadialBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0d5e54" />
      <stop offset="45%" stop-color="#083e37" />
      <stop offset="85%" stop-color="#03221e" />
      <stop offset="100%" stop-color="#011614" />
    </radialGradient>

    <!-- Luxury Gold Gradient for Outer Bezel & Crescent -->
    <linearGradient id="tukoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="78%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Secondary Bright Gold -->
    <linearGradient id="tukoGoldBright" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Golden Rim Gradient around edges -->
    <linearGradient id="tukoRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#78350f" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- Subtle Islamic Star Pattern Overlay -->
    <radialGradient id="ambientTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#14b8a6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow & Glow Filters -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. FULL BLEED SOLID BACKGROUND (No white gaps, fills 100% canvas) -->
  <rect width="512" height="512" fill="url(#tukoRadialBg)" />

  <!-- 2. LUXURIOUS GOLD BEZEL & BORDER ACCENTS (Matches phone frame) -->
  <!-- Outer Gold Rim -->
  <rect
    x="8"
    y="8"
    width="496"
    height="496"
    rx="124"
    fill="none"
    stroke="url(#tukoRimGrad)"
    stroke-width="12"
    stroke-opacity="0.95"
  />

  <!-- Inner Delicate Gold Filigree Border -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="110"
    fill="none"
    stroke="url(#tukoGoldBright)"
    stroke-width="2.5"
    stroke-opacity="0.55"
  />

  <!-- Subtle Corner Islamic Geometric Accents (Gold) -->
  <g stroke="url(#tukoGoldGrad)" stroke-width="2" opacity="0.4" fill="none">
    <path d="M 45 70 L 70 70 L 70 45" />
    <path d="M 467 70 L 442 70 L 442 45" />
    <path d="M 45 442 L 70 442 L 70 467" />
    <path d="M 467 442 L 442 442 L 442 467" />
  </g>

  <!-- 3. CENTRAL AMBIENT GLOW -->
  <circle cx="256" cy="256" r="190" fill="url(#ambientTeal)" />

  <!-- 4. ICON CORE (Centered in the Safe Zone for All Android & iOS Launchers) -->
  <g filter="url(#subtleShadow)">
    <!-- Golden Crescent Moon (Symbol of Faith & Prayer Times) -->
    <path
      d="M 296 112 C 205 112 143 179 143 266 C 143 348 209 410 296 410 C 332 410 368 395 394 369 C 307 379 235 318 235 256 C 235 195 296 138 384 148 C 358 123 328 112 296 112 Z"
      fill="url(#tukoGoldGrad)"
      filter="url(#goldGlow)"
    />

    <!-- Sacred Mihrab Dome / Mosque Silhouette -->
    <path
      d="M 215 390 L 215 287 C 215 235 256 195 297 195 C 338 195 379 235 379 287 L 379 390 Z"
      fill="#ffffff"
      fill-opacity="0.96"
    />

    <!-- Mihrab Arch Inner Core with Gold Border -->
    <path
      d="M 240 390 L 240 307 C 240 266 266 235 297 235 C 328 235 354 266 354 307 L 354 390 Z"
      fill="#03221e"
      stroke="url(#tukoGoldGrad)"
      stroke-width="3"
    />

    <!-- Star of Devotion (5 Daily Prayers Light) -->
    <g>
      <circle cx="297" cy="164" r="18" fill="url(#tukoGoldBright)" filter="url(#goldGlow)" />
      <!-- Radiant rays -->
      <path
        d="M 297 122 L 297 142 M 297 186 L 297 206 M 265 164 L 245 164 M 329 164 L 349 164"
        stroke="url(#tukoGoldGrad)"
        stroke-width="7"
        stroke-linecap="round"
      />
    </g>

    <!-- Glowing Tasbih Beads (Dikri & Remembrance) -->
    <circle cx="174" cy="379" r="12" fill="#2dd4bf" filter="url(#goldGlow)" />
    <circle cx="143" cy="343" r="11" fill="#2dd4bf" fill-opacity="0.85" />
    <circle cx="128" cy="297" r="10" fill="#2dd4bf" fill-opacity="0.7" />
    <circle cx="124" cy="248" r="9" fill="#2dd4bf" fill-opacity="0.55" />
  </g>
</svg>
