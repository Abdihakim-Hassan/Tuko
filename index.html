      :root {
        --app-bg: #03221e;
        color-scheme: dark;

      *, *::before, *::after {
        box-sizing: border-box;

      html {
        margin: 0 !important;
        padding: 0 !important;
        background-color: #03221e !important;
        width: 100% !important;
        height: 100% !important;
        overflow-x: hidden !important;
        -webkit-text-size-adjust: 100%;
        color-scheme: dark;
      }
      body {
        margin: 0 !important;
        padding: 0 !important;
        background-color: #03221e !important;
        color: #f8fafc !important;

        min-height: 100% !important;
        min-height: 100dvh !important;

        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        min-height: 100% !important;
        min-height: 100dvh !important;
        background-color: #03221e !important;
      }
      #tuko-initial-splash {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        margin: 0 !important;
        padding: 24px !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        background-color: #03221e !important;
        color: #f8fafc !important;
        z-index: 99999 !important;
      }
      @keyframes tukoSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes tukoPulseRing {
        0%, 100% { transform: scale(1); opacity: 0.55; }
        50% { transform: scale(1.12); opacity: 0.9; }
      }
      .tuko-logo-spinner {
        animation: tukoSpin 1.15s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        transform-origin: center center;
      }
      .tuko-ring-spinner {
        animation: tukoSpin 1.8s linear infinite reverse;
        transform-origin: center center;
      }

    <script>
      // Capture early beforeinstallprompt event so it is never missed by React
      window.__tukoDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__tukoDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('tuko-prompt-ready'));
      });
    </script>

            <rect x="3" y="3" width="94" height="94" rx="26" fill="url(#splashBgGrad)" stroke="url(#splashGoldGrad)" stroke-width="3" />
            <circle cx="50" cy="52" r="32" fill="#14b8a6" fill-opacity="0.14" />
            <path d="M 58 22 C 40 22 28 35 28 52 C 28 68 41 80 58 80 C 65 80 72 77 77 72 C 60 74 46 62 46 50 C 46 38 58 27 75 29 C 70 24 64 22 58 22 Z" fill="url(#splashGoldGrad)" />
            <path d="M 42 76 L 42 56 C 42 46 50 38 58 38 C 66 38 74 46 74 56 L 74 76 Z" fill="#ffffff" fill-opacity="0.95" />
            <path d="M 47 76 L 47 60 C 47 52 52 46 58 46 C 64 46 69 52 69 60 L 69 76 Z" fill="#083344" />
            <circle cx="58" cy="32" r="3.5" fill="url(#splashGoldGrad)" />
            <path d="M 58 24 L 58 28 M 58 36 L 58 40 M 52 32 L 48 32 M 64 32 L 68 32" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />

            <circle cx="25" cy="58" r="1.8" fill="#2dd4bf" fill-opacity="0.6" />
